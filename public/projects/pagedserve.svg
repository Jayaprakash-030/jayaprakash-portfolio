<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="PagedServe LLM inference engine throughput: 23 tokens per second baseline versus 783 tokens per second">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" />
  <rect x="82" y="92" width="1036" height="516" rx="30" fill="#0f172a" opacity="0.82" stroke="#334155" />
  <g font-family="Inter, Arial, sans-serif">
    <text x="140" y="190" fill="#f8fafc" font-size="50" font-weight="700">PagedServe</text>
    <text x="140" y="245" fill="#94a3b8" font-size="23">LLM inference engine from scratch, Qwen3-0.6B on a single T4</text>
    <text x="140" y="332" fill="#94a3b8" font-size="20">Naive baseline</text>
    <rect x="140" y="347" width="880" height="34" rx="8" fill="#1e293b" />
    <rect x="140" y="347" width="26" height="34" rx="8" fill="#64748b" />
    <text x="182" y="372" fill="#cbd5e1" font-size="20" font-weight="700">23 tok/s</text>
    <text x="140" y="440" fill="#94a3b8" font-size="20">KV cache + batching</text>
    <rect x="140" y="455" width="880" height="34" rx="8" fill="url(#bar)" />
    <text x="150" y="480" fill="#0f172a" font-size="20" font-weight="700">783 tok/s</text>
    <text x="140" y="550" fill="#67e8f9" font-size="28" font-weight="700">34x throughput</text>
  </g>
</svg>
