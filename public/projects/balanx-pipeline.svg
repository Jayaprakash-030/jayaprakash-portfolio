<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="Real-time multimodal emotion pipeline architecture: browser capture, windowing, Redis Streams, parallel face, voice and text models on GPU, LLM reply with DynamoDB memory">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#08111f" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b" />
    </marker>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)" />
  <rect x="50" y="50" width="1100" height="560" rx="30" fill="#0f172a" opacity="0.82" stroke="#334155" />
  <g font-family="Inter, Arial, sans-serif">
    <text x="90" y="110" fill="#f8fafc" font-size="32" font-weight="700">Real-Time Multimodal Emotion Pipeline</text>
    <text x="90" y="145" fill="#94a3b8" font-size="18">Budget: 2.5s end to end. Latency cut from 4.6s to ~1.1s.</text>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="90" y="270" width="150" height="90" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="165" y="310" fill="#67e8f9">Browser</text>
      <text x="165" y="334" fill="#94a3b8" font-size="14" font-weight="400">WebRTC A/V capture</text>

      <rect x="290" y="270" width="150" height="90" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="365" y="321" fill="#fbbf24">Windowing</text>

      <rect x="490" y="270" width="150" height="90" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="565" y="310" fill="#67e8f9">Redis Streams</text>
      <text x="565" y="334" fill="#94a3b8" font-size="14" font-weight="400">consumer groups</text>

      <rect x="720" y="190" width="170" height="64" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="805" y="229" fill="#fbbf24">Face model</text>
      <rect x="720" y="278" width="170" height="64" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="805" y="317" fill="#fbbf24">Voice model</text>
      <rect x="720" y="366" width="170" height="64" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="805" y="405" fill="#fbbf24">Text model</text>
      <text x="805" y="458" fill="#94a3b8" font-size="14" font-weight="400">in parallel on GPU</text>

      <rect x="940" y="270" width="170" height="90" rx="14" fill="#111827" stroke="#1f2937" />
      <text x="1025" y="310" fill="#67e8f9">LLM reply</text>
      <text x="1025" y="334" fill="#94a3b8" font-size="14" font-weight="400">memory in DynamoDB</text>
    </g>

    <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M240 315 H286" />
      <path d="M440 315 H486" />
      <path d="M640 315 C680 315 680 222 716 222" />
      <path d="M640 315 H716" />
      <path d="M640 315 C680 315 680 398 716 398" />
      <path d="M890 222 C915 222 915 315 936 315" />
      <path d="M890 310 H936" />
      <path d="M890 398 C915 398 915 315 936 315" />
    </g>
  </g>
</svg>
